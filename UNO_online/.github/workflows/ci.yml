name: CI

# Приложение лежит в подпапке UNO_online/, поэтому все шаги выполняются из неё.
# Workflows GitHub читает только из .github/ в КОРНЕ репозитория.

on:
  pull_request:
  push:
    branches: [ main ]

# Новый пуш в ту же ветку отменяет ещё идущую проверку предыдущего
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: UNO_online

jobs:
  # ---------- Безопасность ----------
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: UNO_online
          bundler-cache: true

      - name: Статический анализ уязвимостей Rails (Brakeman)
        run: bundle exec brakeman --no-pager

      - name: Проверка гемов на известные уязвимости (bundler-audit)
        run: bundle exec bundler-audit check --update --config config/bundler-audit.yml

  # ---------- Стиль кода ----------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: UNO_online
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop -f github

  # ---------- Автотесты ----------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - name: Системные библиотеки
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
        working-directory: .

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: UNO_online
          bundler-cache: true

      - name: Проверка автозагрузки классов (Zeitwerk)
        run: bundle exec rails zeitwerk:check

      - name: Подготовка тестовой БД и запуск тестов
        run: bundle exec rails db:test:prepare test

  # ---------- Доставка (CD): сборка Docker-образа ----------
  # Запускается только после успешных проверок и только на main.
  # Образ публикуется в GitHub Container Registry (ghcr.io); автоматического
  # деплоя на сервер здесь нет — его можно добавить позже (например, через Kamal).
  publish_image:
    needs: [ scan_ruby, lint, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: UNO_online
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
